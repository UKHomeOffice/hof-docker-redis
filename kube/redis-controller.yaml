apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      name: redis
  template:
    metadata:
      labels:
        name: redis
    spec:
      securityContext:
        runAsUser: 994
        runAsGroup: 994
        fsGroup: 994
      terminationGracePeriodSeconds: 30
      containers:
      - name: redis
        image: ukhomeofficedigital/redis:latest
        ports:
        - containerPort: 6379
        command:
        - "/usr/bin/bash"
        - "-c"
        - "/run.sh ${REDIS_SENTINEL_SERVICE_HOST} ${REDIS_SENTINEL_SERVICE_PORT}"
        resources:
          limits:
            cpu: "0.1"
        volumeMounts:
        - mountPath: /var/lib/redis
          name: data
      - name: redis-sentinel
        image: ukhomeofficedigital/redis:latest
        ports:
        - containerPort: 26379
        command:
        - "/usr/bin/bash"
        - "-c"
        - "/run.sh ${REDIS_SENTINEL_SERVICE_HOST} ${REDIS_SENTINEL_SERVICE_PORT}"
        env:
        - name: SENTINEL
          value: "true"
        resources:
          limits:
            cpu: "0.1"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: gp3
      resources:
        requests:
          storage: 5Gi
